{% extends 'petcare/base.html' %}

{% block title %}Tutores y Mascotas - PetCare{% endblock %}

{% block content %}
<h2>Registro de Tutores y Mascotas</h2>

<div class="card">
  <h3>Nuevo Registro</h3>
  <form id="form-tutor-mascota">
    <div class="form-group">
      <label for="tutor_nombre">Nombre Tutor:</label>
      <input type="text" id="tutor_nombre" required>
    </div>
    <div class="form-group">
      <label for="mascota_nombre">Nombre Mascota:</label>
      <input type="text" id="mascota_nombre" required>
    </div>
    <div class="form-group">
      <label for="especie">Especie / Raza:</label>
      <input type="text" id="especie" required>
    </div>
    <button type="submit" class="btn">Guardar</button>
  </form>
</div>

<div class="card">
  <h3>Listado de Pacientes Registrados</h3>
  <table>
    <thead>
      <tr>
        <th>Tutor</th>
        <th>Mascota</th>
        <th>Especie/Raza</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Juan Pérez</td>
        <td>Max</td>
        <td>Perro / Labrador</td>
        <td><button class="btn">Editar</button></td>
      </tr>
    </tbody>
  </table>
</div>
{% endblock %}
